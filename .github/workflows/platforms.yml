name: Build and check platforms
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - name: Package Windows WASAPI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -NoAsio -Package
      - name: Package native Unix desktop
        if: runner.os != 'Windows'
        run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: shredini-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --root target/tools
      - run: node --test web/tests/*.test.mjs
      - run: python scripts/build-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: shredini-web
          path: dist/*-web.zip
