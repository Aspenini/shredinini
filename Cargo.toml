[package]
name = "shredini"
version = "0.3.0"
edition = "2024"
description = "A small guitar and MIDI instrument studio for Windows"
license = "MIT"

[features]
# Plain Cargo builds work with Windows audio without the optional ASIO SDK/Clang.
# The release build script explicitly enables ASIO unless -NoAsio is requested.
default = []
asio = ["cpal/asio"]
screenshot = ["eframe/__screenshot"]

[dependencies]
anyhow = "1"
biquad = "0.5"
cpal = { version = "=0.18.2", features = ["realtime"] }
directories = "6"
midir = "0.11"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
ringbuf = "0.4"
rustysynth = "1.3"
rfd = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "wav", "ogg", "pcm"] }
rubato = { version = "5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

