[package]
name = "shredini"
version = "0.2.1"
edition = "2024"
description = "A small guitar and MIDI instrument studio for Windows"
license = "MIT"

[features]
default = ["asio"]
asio = ["cpal/asio"]
screenshot = ["eframe/__screenshot"]

[dependencies]
anyhow = "1"
biquad = "0.5"
cpal = { version = "=0.18.2", features = ["realtime"] }
directories = "6"
midir = "0.11"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
ringbuf = "0.4"
rubato = { version = "5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

