[package]
name = "shredini"
version = "0.4.0"
edition = "2024"
description = "A cross-platform guitar and MIDI instrument studio"
license = "MIT"

[features]
# Plain Cargo builds work with Windows audio without the optional ASIO SDK/Clang.
# The release build script explicitly enables ASIO unless -NoAsio is requested.
default = []
asio = ["cpal/asio"]
screenshot = ["eframe/__screenshot"]

[lib]
name = "shredini_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
biquad = "0.5"
ringbuf = "0.4"
rustysynth = "1.3"
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "wav", "ogg", "pcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "=0.18.2", features = ["realtime"] }
directories = "6"
midir = "0.11"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rfd = "0.15"
rubato = { version = "5", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

